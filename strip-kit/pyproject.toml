[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "strip-kit"
version = "0.1.3"
description = "Backend for the strip and strip-lab skills: de-identification rules store, synthetic fixtures and re-identification trials on Bedrock, deployed as one Lambda and one DynamoDB table."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["boto3"]
keywords = ["de-identification", "privacy", "bedrock", "aws-lambda", "aws-sam", "llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/jonasbu11/PreSales/tree/main/strip-kit"
Repository = "https://github.com/jonasbu11/PreSales"
Changelog = "https://github.com/jonasbu11/PreSales/blob/main/CHANGELOG.md"
Security = "https://github.com/jonasbu11/PreSales/security/policy"

# lambda/ stays the SAM CodeUri (template.yaml, Handler: handler.handler); the same directory is
# installed as the importable package strip_kit, so `from strip_kit import handler`.
[tool.setuptools]
package-dir = {"strip_kit" = "lambda"}
packages = ["strip_kit"]
