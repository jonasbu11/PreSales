name: publish strip-kit

# Tag vX.Y.Z on main publishes strip-kit X.Y.Z to PyPI through Trusted Publishing (OIDC):
# no API token exists anywhere. PyPI side: pending/trusted publisher for project strip-kit,
# owner jonasbu11, repository PreSales, workflow publish-strip-kit.yml, environment pypi.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: strip-kit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install boto3 pyyaml cfn-lint
      - run: python tests/test_handler.py
      - run: python tests/test_template.py
      - run: cfn-lint template.yaml
      - name: pyproject version matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "v$v" = "$GITHUB_REF_NAME" || { echo "pyproject version $v does not match tag $GITHUB_REF_NAME"; exit 1; }

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build strip-kit
      - run: python -m twine check --strict strip-kit/dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: strip-kit/dist/

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/strip-kit/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
